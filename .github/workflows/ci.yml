name: CI

# Every merge into main so far was reviewed by reading. This is the machine
# saying main builds and the headless tests pass.
#
# The runners are self-hosted on pc-ajim since 2026-09-05 12:49 (decision 24):
# GitHub-hosted jobs stopped starting at 12:35 with "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased". Two runner services since 2026-09-06 03:10 (owner: "CI
# improvement takes priorities from all other work"):
# actions.runner.screamyx-surya.pc-ajim-surya at /store/gha-runner-surya with
# CARGO_TARGET_DIR=/store/surya-ci-target, and pc-ajim-surya-2 at
# /store/gha-runner-surya-2 with /store/surya-ci-target-2 (a copy of the
# first). Each target dir is that runner's cache; no rust-cache action. Each
# runner takes one job at a time, so the workflow is ONE job: three jobs on
# one runner ran serially anyway and paid three checkouts and two extra link
# passes per PR (about 30 min); one job with the same steps is about half
# that, and two runners take two PRs at once. The system libraries gpui needs are already on
# the box, so the apt and "free disk space" steps of the hosted era are gone:
# never `sudo rm -rf` or `apt-get` on a shared machine from CI.
#
# `app/` is the comet subtree and holds the cargo workspace, so every job runs
# there. `app/.github/workflows/` is comet's own release pipeline: GitHub only
# reads workflows from the repository root, so those files never fire here and
# are not touched.
#
# There is no `cargo fmt --check` step. The upstream comet tree is not
# fmt-clean, so the check would fail on code nobody in this project wrote.

on:
  pull_request:
  push:
    branches: [main]
    # docs-only pushes (handoff notes land every few minutes) must not cancel
    # the run that proves main builds; the concurrency group below cancels
    # in-progress runs on the same ref.
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is what makes these test binaries enormous. The first run of
  # this workflow died linking one of them:
  #   collect2: fatal error: ld terminated with signal 7 [Bus error], core dumped
  # A bus error out of ld is the runner running out of room, not a code fault.
  # Tests do not need debug info to pass, so turn it off: smaller objects, far
  # less linker memory, a faster build.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # One job, four steps, in the order that fails fastest. The six headless
  # crates first (no gpui, the useful signal), then the whole-workspace check,
  # then a2ui's tests (headless, but they pay the gpui build), then the smoke
  # (one engine over the real websocket, driven by the binaries a user runs).
  ci:
    name: ci
    runs-on: [self-hosted, surya-ci]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain (app/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # --jobs 2 was set when roughly twenty test binaries linking at once
      # exhausted the runner with debug info on. Debug info is off (env above)
      # and MemoryHigh is set on the service, so six at a time is safe.
      - name: headless tests
        run: |
          cargo test --jobs 6 \
            -p zeron-proto \
            -p zeron-doc \
            -p zeron-rpc \
            -p zeron-engine \
            -p zeron-harness \
            -p surya-mcp

      - name: cargo check (whole workspace)
        run: cargo check --workspace --all-targets

      - name: cargo test -p surya-a2ui
        run: cargo test --jobs 6 -p surya-a2ui

      - name: smoke
        env:
          SURYA_SMOKE_CARGO: cargo
        run: scripts/smoke.sh
