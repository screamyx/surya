name: CI

# Every merge into main so far was reviewed by reading. This is the machine
# saying main builds and the headless tests pass.
#
# The runner is self-hosted on pc-ajim since 2026-09-05 12:49 (decision 24):
# GitHub-hosted jobs stopped starting at 12:35 with "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased", and the RC ships 2026-09-06 13:00. The runner service is
# actions.runner.screamyx-surya.pc-ajim-surya at /store/gha-runner-surya,
# throttled to CPUWeight=20 so the owner's interactive session wins, with a
# persistent CARGO_TARGET_DIR=/store/surya-ci-target in its .env (that is the
# cache; no rust-cache action). The system libraries gpui needs are already on
# the box, so the apt and "free disk space" steps of the hosted era are gone:
# never `sudo rm -rf` or `apt-get` on a shared machine from CI.
#
# `app/` is the comet subtree and holds the cargo workspace, so every job runs
# there. `app/.github/workflows/` is comet's own release pipeline: GitHub only
# reads workflows from the repository root, so those files never fire here and
# are not touched.
#
# There is no `cargo fmt --check` step. The upstream comet tree is not
# fmt-clean, so the check would fail on code nobody in this project wrote.

on:
  pull_request:
  push:
    branches: [main]
    # docs-only pushes (handoff notes land every few minutes) must not cancel
    # the run that proves main builds; the concurrency group below cancels
    # in-progress runs on the same ref.
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is what makes these test binaries enormous. The first run of
  # this workflow died linking one of them:
  #   collect2: fatal error: ld terminated with signal 7 [Bus error], core dumped
  # A bus error out of ld is the runner running out of room, not a code fault.
  # Tests do not need debug info to pass, so turn it off: smaller objects, far
  # less linker memory, a faster build.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The useful signal, first and on its own: none of these six crates depends
  # on gpui, so this job needs no system libraries and does not wait for the
  # GUI stack to compile.
  tests:
    name: headless tests
    runs-on: [self-hosted, surya-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4


      - name: rust toolchain (app/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install


      # Same reason: roughly twenty test binaries linking at once is what
      # exhausted the runner. Two at a time still finishes inside the timeout.
      - name: cargo test
        run: |
          cargo test --jobs 2 \
            -p zeron-proto \
            -p zeron-doc \
            -p zeron-rpc \
            -p zeron-engine \
            -p zeron-harness \
            -p surya-mcp

  # One engine, driven over the real websocket by the binaries a user runs.
  # Runs after `headless tests`: if a crate's own tests are red, the smoke's
  # failure would only repeat that, and this job costs a `zeron` link.
  #
  # `-p zeron` pulls gpui, so this job needs the same system libraries the
  # check job installs.
  smoke:
    name: smoke
    runs-on: [self-hosted, surya-ci]
    needs: tests
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4



      - name: rust toolchain (app/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install


      # a2ui's tests ride this job: every one of them is headless (elements
      # build without a window) and the gpui build is already paid for here.
      - name: cargo test -p surya-a2ui
        run: cargo test --jobs 2 -p surya-a2ui

      - name: smoke
        env:
          SURYA_SMOKE_CARGO: cargo
        run: scripts/smoke.sh

  # Everything else, including the gpui/ui crates. The system libraries are
  # the ones comet's own release workflow installs
  # (app/.github/workflows/release.yml), so they are known to be enough and
  # they are ordinary apt packages.
  check:
    name: cargo check (whole workspace)
    runs-on: [self-hosted, surya-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4


      - name: rust toolchain (app/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install


      - name: cargo check
        run: cargo check --workspace --all-targets
