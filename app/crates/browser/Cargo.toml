[package]
name = "surya-browser"
# Not a workspace member (see app/Cargo.toml `exclude`), so no inheritance.
version = "0.2.34"
edition = "2024"
license = "MIT"
publish = false
description = "haktui's offscreen Chromium (CEF) pane, ported onto comet's gpui"

# Its own root: app/Cargo.toml excludes this crate so CI never pulls CEF.
# Build it through `cargo build -p zeron --features browser`; run its tests
# from this directory (`cargo test`, needs CEF_PATH and a cargo slot).
[workspace]

[dependencies]
gpui = { git = "https://github.com/screamyx/gpui-surya", rev = "a07e9577ec788feb73c06fe7e307a3df8adaa895" }
futures = "0.3"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Offscreen Chromium. The build script downloads the CEF binary for the
# target into CEF_PATH (or OUT_DIR) and copies the runtime files next to the
# binaries in the target dir; see README.md.
cef = "151.8.0"

# Zero-copy frames (`zero_copy/d3d11.rs`): this crate's own D3D11 device and
# the GPU copy out of CEF's shared texture. Also the clock's high-resolution
# waitable timer and the display's refresh rate (`clock.rs`, `perf.rs`). The
# version is the one `cef` itself pulls on Windows, so the tree carries one
# `windows` crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
] }
