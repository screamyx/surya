[package]
name = "surya-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
surya-proto.workspace = true
similar.workspace = true
surya-doc.workspace = true
surya-engine.workspace = true
surya-harness.workspace = true
surya-rpc.workspace = true
surya-update.workspace = true
surya-syntax.workspace = true
surya-theme.workspace = true
surya-browser = { workspace = true, optional = true }
surya-a2ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
unicode-width.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
# The CEF browser pane (crates/browser). Off by default: the default build
# has no Chromium in it.
browser = ["dep:surya-browser"]

[dev-dependencies]
tempfile.workspace = true
# The watch tests drive a real pane against a real RpcClient; both need
# gpui's deterministic executor.
gpui = { workspace = true, features = ["test-support"] }
