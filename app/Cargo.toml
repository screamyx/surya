[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/proto",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/mcp",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "crates/syntax",
    "crates/a2ui",
    "crates/test-deadlines",
    "apps/surya",
]
# surya-browser is a path dependency, not a member: it links Chromium (CEF)
# and its build script downloads the CEF binary, which `cargo check
# --workspace` (CI) must never pull. `-p surya --features browser` builds it.
exclude = ["crates/browser"]

[workspace.package]
version = "0.2.34"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
surya-proto = { path = "crates/proto" }
surya-doc = { path = "crates/doc" }
surya-sync = { path = "crates/sync" }
surya-harness = { path = "crates/harness" }
surya-engine = { path = "crates/engine" }
surya-rpc = { path = "crates/rpc" }
surya-update = { path = "crates/update" }
surya-ui = { path = "crates/ui" }
surya-syntax = { path = "crates/syntax" }
surya-theme = { path = "crates/theme" }
surya-test-deadlines = { path = "crates/test-deadlines" }
# surya: haktui's CEF browser pane, behind the `browser` feature on surya-ui and surya.
surya-browser = { path = "crates/browser" }
surya-a2ui = { path = "crates/a2ui" }

# CRDT
loro = "1.13"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# gpui — combined Windows pacing head 3640743b70, retaining owned external textures.
# SURYA_FRAME_LATENCY and SURYA_PRESENT_WAITABLE are independent, default OFF.
# CEF zero-copy remains opt-in. See docs/perf/windows-frame-pacing.md.
# The base branch surya/hlsl-edge-fade: wingleeio/zed at
# e2ddcc68 (kept there as branch wingleeio-e2ddcc68) plus f910653 which adds
# the EdgeFadeParams field to the HLSL Quad and PolychromeSprite. Without it
# the Windows structured-buffer stride (192 B per quad from the Rust struct)
# disagreed with the shader's 160 B and filled quads dropped per frame
# (docs/probes/windows-dropped-quads-2026-09-05.md). The wingleeio history:
# the wingleeio/zed fork: upstream f14fea9 + commits on
# `comet/edge-fade-horizontal` (tip of `comet/line-wrap-closing-punctuation`
# + 5d1f83d horizontal per-pixel EdgeFade for quads/images; rebase when bumping the
# upstream rev): a6bf17c fixes BOTH wrap-rule copies (LineWrapper +
# line_layout's shaped-text duplicate); 14baea0 adds the EdgeFade primitive
# (Window::with_edge_fade — per-primitive scroll-edge fades for the glass
# sidebar); a6c1ad5 adds BackdropBlur + horizontal EdgeFade + glass fixes;
# 9b672fa bounds renderer GPU memory (region-sized backdrop blur scratch,
# idle release of blur/path intermediates, instance pool shrink,
# SURYA_GPU_STATS=1 diagnostics); b687328 adds ImageSource::evict (frees
# sprite-atlas tiles — remove_asset alone leaked them, see
# attachments::flush_evicted); ac135eb adds device memory to the stats line;
# f596cde fixes destination alpha on transparent windows (Porter-Duff OVER,
# not additive); 53518c0 merges the edge-fade line: per-edge fade bands +
# per-pixel EdgeFade for quads/images (true fade-into-glass), and
# object-fit Cover cropping via atlas-tile UVs so image corner radii hold;
# 8a8954c switches the macOS blurred view to UnderWindowBackground (macOS 26
# stopped vending CABackdropLayer for Selection — window blur went dead);
# b68970e rasterizes BackdropBlur in the wgpu renderer (frosted floats on
# Linux — the Metal path's snapshot/blur/composite, ported).
gpui = { git = "https://github.com/screamyx/gpui-surya", rev = "3640743b70a6e4647d90249fc6ccc5398322648a" }
gpui_platform = { git = "https://github.com/screamyx/gpui-surya", rev = "3640743b70a6e4647d90249fc6ccc5398322648a", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/screamyx/gpui-surya", rev = "3640743b70a6e4647d90249fc6ccc5398322648a" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.23"
ttf-parser = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
