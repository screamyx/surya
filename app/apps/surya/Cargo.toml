[package]
name = "surya"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "surya"
path = "src/main.rs"

# CEF's subprocess (renderer, GPU, utility). Must sit next to `surya`.
[[bin]]
name = "surya-browser-helper"
path = "src/browser_helper.rs"
required-features = ["browser"]

[dependencies]
surya-engine.workspace = true
surya-proto.workspace = true
surya-rpc.workspace = true
surya-ui.workspace = true
surya-update.workspace = true
surya-browser = { workspace = true, optional = true }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[features]
# The CEF browser pane. `cargo build -p surya --features browser` builds
# `surya` with the pane and the `surya-browser-helper` subprocess binary.
browser = ["surya-ui/browser", "dep:surya-browser"]

[dev-dependencies]
tempfile.workspace = true
